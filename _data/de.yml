# Systembrett
systembrett_eyebrow: "Virtuelle Systemische Aufstellungen"
systembrett_title_line1: "Systembrett Online"
systembrett_title_em: "kostenlos"
systembrett_p1: "Führungsfragen, Rollenkonflikte oder Teamdynamiken lassen sich oft schwer in Worte fassen – auf dem virtuellen Systembrett werden sie räumlich erkennbar. Sie positionieren Figuren frei auf der Fläche, drehen ihre Blickrichtung und halten Zwischenstände fest, ohne dass ein physisches Brett vor Ort sein muss."
systembrett_p2: "Praxiserprobt mit Einzelpersonen und Gruppen, funktioniert das Brett direkt im Browser: Figuren, Bodenformen und Notizen lassen sich anlegen, verschieben, skalieren und benennen – für die Aufstellung im Einzelsetting genauso wie begleitend in Präsenzsitzungen."
systembrett_cta: "Direkt zum Systembrett →"
systembrett_headline: "Systemische Aufstellung Online"

# Coaching LP
coaching_s1_title: "Führungskräfte-Coaching"
coaching_s1_lead: "Klarheit, Wirkung und Souveränität in komplexen Führungssituationen für Führungskräfte in Start-ups, Unternehmen und Behörden."
coaching_s1_p1: ""
coaching_s1_p2: "Vertrauliche 1:1-Begleitung in dynamischen Wachstumsphasen, bei Rollenwechseln oder wenn sie in einer Sackgasse stecken. Wir reflektieren Führungsstile, stärken Entscheidungssicherheit und entwickeln pragmatische Lösungen für den Führungsalltag."
coaching_s1_p3: "Ich helfe ihnen, ihr Kommunikationsbewusstsein durch Achtsamkeit und innere Führung zu stärken. Dadurch werden Spannungen abgebaut und die Grundlage für effektivere Mitarbeitergespräche gelegt, um eine sichere, positive Arbeitsatmosphäre zu fördern und Motivation, Zufriedenheit und das Selbstvertrauen der Mitarbeitenden nachhaltig verbessert."
coaching_s1_cred1_title: "Zielgruppe"
coaching_s1_cred1_text: "Führungskräfte, Abteilungsleitung, Nachwuchsführung"
coaching_s1_cred2_title: "Format"
coaching_s1_cred2_text: "6–12 Sitzungen à 60 Min., Präsenz in Berlin, DACH oder Online"
coaching_s1_cta: "Erstgespräch anfragen"

coaching_s2_title: "Coaching für Transformation, Change und Teamentwicklung"
coaching_s2_lead: "Veränderungen strategisch gestalten und Teams wirksam mitnehmen."
coaching_s2_p1: "Transformation gelingt nur, wenn Strategie, Kultur und operative Abläufe ineinandergreifen. Ich begleite Organisationen bei tiefgreifenden Restrukturierungen, agilen Übergängen und der Einführung von KI-gestützten Arbeitsweisen aus einer ganzheitlichen Führungsperspektive."
coaching_s2_p2: "Gute Zusammenarbeit entsteht durch Vertrauen, psychologische Sicherheit und eine konstruktive Konfliktkultur. In maßgeschneiderten Workshops klären wir Rollen, etablieren transparente Feedbackprozesse und schaffen ein gemeinsames Verständnis für Ownership und Ergebnisse."
coaching_s2_cred1_title: "Nutzen"
coaching_s2_cred1_text: "Gesundes Wachstum, weniger Silos, zufriedenere Teams"
coaching_s2_cred2_title: "Ansatz"
coaching_s2_cred2_text: "Strukturiertes Change Management mit klaren Meilensteinen"
coaching_s2_cta: "Transformationsberatung anfragen"

coaching_s3_title: "Coaching für Digitalisierung & New Work in Organisationen und Behörden"
coaching_s3_lead: "Reorganisation und digitale Transformation in Behörden und Unternehmen stellen oft eine besondere Herausforderung dar."
coaching_s3_p1: "Klassische Führungsrollen werden nach und nach durch moderne Führungsmethoden ergänzt, deren Alltag von dynamischen Prozessen, Digitalisierung und KI geprägt ist. Die Anforderungen von <em>New Work</em> führen bei Führungskräften oft zu Unsicherheit. Typische Fragen: „Darf ich meinen Mitarbeitenden überhaupt noch sagen, was sie machen sollen, oder kommt das jetzt alles <em>bottom-up</em>?“. Oder: Wie setze ich agile Arbeitsweisen effektiv um?“"
coaching_s3_p2: "Wir erarbeiten, welche Bedeutung Führung gerade während der Transition und in agilen Arbeitsumfeldern hat – angepasst an die individuelle Persönlichkeit und das aktuelle Arbeutssituation."
coaching_s3_cred1_title: "Format"
coaching_s3_cred1_text: "Offsites, Team-Workshops, 1–2 Tage, Retrospektiven"
coaching_s3_cred2_title: "Nutzen"
coaching_s3_cred2_text: "Starke Führung, leistungsstärkere und effiziente Teams."
coaching_s3_cta: "Workshop anfragen"
