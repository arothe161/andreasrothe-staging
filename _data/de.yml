# Über mich
about_label: "Über mich"
about_title_line1: "Klarheit durch"
about_title_em: "Erfahrung."
about_p1: "Als langjährige Führungskraft in schnell wachsenden Technologieunternehmen kenne ich die Herausforderungen des operativen und strategischen Führungsalltags aus eigener Erfahrung."
about_p2: "In Kombination mit der Ausbildung als Systemischer Coach, verbinde ich unternehmerisches Verständnis mit systemischer Methodenkompetenz. Kein theoretisches Lehrbuchwissen, sondern ein vertrauensvoller Sparringspartner auf Augenhöhe."
about_p3: "Ich unterstütze neue und Erfahrene Führungskräfte dabei, Ihre Führungswirkung zu stärken, komplexe Schnittstellen zu steuern und auch in Phasen hoher Unsicherheit handlungsfähig und fokussiert zu bleiben."
about_cred1_title: "Rolle"
about_cred1_text: "15+ Jahre Führungserfahrung, bei Zalando, Redcare und Mister Spex."
