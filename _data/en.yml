about_p1: "As an experienced leader in fast-growing technology companies, I know the operational and strategic challenges of leadership from first-hand experience."
about_p2: "Combined with my training as a systemic coach, I bring together business understanding and systemic coaching expertise. Not theoretical textbook knowledge, but a trusted sparring partner at eye level."
