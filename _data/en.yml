# Coaching LP
coaching_s1_title: "Leadership Coaching"
coaching_s1_lead: "Clarity, impact and confidence in complex leadership situations."
coaching_s1_p1: "Leadership coaching for people in start-ups, companies and public-sector organisations, for experienced leaders and those stepping into leadership roles."
coaching_s1_p2: "Confidential one-to-one support for founders, C-suite executives and leaders during dynamic growth phases, role transitions or strategic realignments. Together, we reflect on leadership styles, strengthen decision-making confidence and develop pragmatic solutions for day-to-day leadership."
coaching_s1_p3: "The focus lies on building greater personal communication awareness and establishing clear, respectful interaction patterns within the organization. This includes tailoring communication to different audiences—such as client conversations—reducing and preventing internal friction, and developing or renewing core communication skills. Reliable structures for meetings further support a secure, positive work environment, ultimately boosting employee motivation, satisfaction, and confidence."
coaching_s1_cred1_title: "For whom"
coaching_s1_cred1_text: "Leaders, founders, C-suite executives, department heads and emerging leaders"
coaching_s1_cred2_title: "Formats"
coaching_s1_cred2_text: "6–12 sessions of 90 minutes, in person in Berlin, across DACH or online"
coaching_s1_cta: "Request an initial conversation"

coaching_s2_title: "Transformation, Change and Team Development"
coaching_s2_lead: "Shape change strategically and bring teams along effectively."
coaching_s2_p1: "Transformation succeeds when strategy, culture and operational processes work together. I support organisations through far-reaching restructurings, agile transitions and the introduction of AI-enabled ways of working from an integrated leadership perspective."
coaching_s2_p2: "Strong collaboration grows from trust, psychological safety and a constructive approach to conflict. In tailored workshops, we clarify roles, establish transparent feedback processes and build a shared understanding of ownership and results."
coaching_s2_cred1_title: "Benefits"
coaching_s2_cred1_text: "Healthy growth, fewer silos and healthier teams"
coaching_s2_cred2_title: "Approach"
coaching_s2_cred2_text: "Structured change management with clear milestones"
coaching_s2_cta: "Request transformation consulting"

coaching_s3_title: "Digital Transformation and New Work in Organisations and the Public Sector"
coaching_s3_lead: "Reorganisation and digital transformation in public-sector and private-sector organisations often present particular challenges."
coaching_s3_p1: "Traditional leadership roles are increasingly complemented by modern leadership practices shaped by dynamic processes, digitalisation and AI. The demands of <em>New Work</em> can create uncertainty for leaders. A typical question is: “Am I still allowed to tell my team what to do, or does everything now have to come <em>bottom-up</em>?”"
coaching_s3_p2: "Together, we explore the role of leadership during transition and in agile working environments, tailored to your individual personality and current organisational context."
coaching_s3_cred1_title: "Formats"
coaching_s3_cred1_text: "Offsites, team workshops (1–2 days) and retrospectives"
coaching_s3_cred2_title: "Benefits"
coaching_s3_cred2_text: "Strong leadership and more effective, higher-performing teams"
coaching_s3_cta: "Request a workshop"
