# About
about_label: "About"
about_title_line1: "Clarity through"
about_title_em: "experience."
about_p1: "As a long-standing leader in fast-growing technology companies, I know the operational and strategic challenges of day-to-day leadership from first-hand experience."
about_p2: "Combined with my training as a systemic coach, I bring together business understanding and systemic methodology. Not theoretical textbook knowledge, but a trusted sparring partner who meets you as an equal."
about_p3: "I support new and experienced leaders in strengthening their leadership impact, managing complex interfaces and remaining capable of action and focused even in periods of high uncertainty."
about_cred1_title: "Experience"
