<header>
  <nav>
    <a href="{% if page.lang == 'de' %}{{ '/' | relative_url }}{% else %}{{ '/en/' | relative_url }}{% endif %}" class="nav-logo">ANDREAS ROTHE</a>
    
    <button class="nav-toggle" id="navToggle" aria-label="Menue oeffnen" aria-expanded="false">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>

    <div class="nav-menu" id="navMenu">
      <ul class="nav-links">
        <li><a href="{% if page.lang == 'de' %}{{ '/#angebote' | relative_url }}{% else %}{{ '/en/#angebote' | relative_url }}{% endif %}">{{ site.data[page.lang].nav_services }}</a></li>
		<li><a href="{% if page.lang == 'de' %}{{ '/fuehrungskraefte-coaching' | relative_url }}{% else %}{{ '/en/leadership-coaching' | relative_url }}{% endif %}">{{ site.data[page.lang].nav_coaching }}</a></li>
        <li><a href="{% if page.lang == 'de' %}{{ '/#ueber-mich' | relative_url }}{% else %}{{ '/en/#ueber-mich' | relative_url }}{% endif %}">{{ site.data[page.lang].nav_about }}</a></li>
     <!--   <li><a href="{% if page.lang == 'de' %}{{ '/#testimonials' | relative_url }}{% else %}{{ '/en/#testimonials' | relative_url }}{% endif %}">{{ site.data[page.lang].nav_testimonials }}</a></li> -->
        <li><a href="{% if page.lang == 'de' %}{{ '/#kontakt' | relative_url }}{% else %}{{ '/en/#kontakt' | relative_url }}{% endif %}">{{ site.data[page.lang].nav_contact }}</a></li>
		<li><a class="social-link" href="https://www.linkedin.com/in/andreas-rothe-0ba15612b/" target="_blank" rel="noopener" aria-label="LinkedIn-Profil von Andreas Rothe">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
    <path d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854zm4.943 12.248V6.169H2.542v7.225zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248S2.4 3.226 2.4 3.934c0 .694.521 1.248 1.327 1.248zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016l.016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225z"/>
  </svg>
</a></li>	  
      </ul>

      <div class="lang-switch">
        {% if page.lang == 'de' %}
          <a href="{{ '/en/' | relative_url }}" class="lang-icon-link" title="Switch to English version" aria-label="Switch to English version">
            <img src="{{ '/assets/icons/flag-en.svg' | relative_url }}" alt="English" class="lang-flag-icon">
          </a>
        {% else %}
          <a href="{{ '/' | relative_url }}" class="lang-icon-link" title="Zur deutschen Version wechseln" aria-label="Zur deutschen Version wechseln">
            <img src="{{ '/assets/icons/flag-de.svg' | relative_url }}" alt="Deutsch" class="lang-flag-icon">
          </a>
        {% endif %}
      </div>
    </div>
  </nav>
  <script>
    (function() {
      var toggle = document.getElementById('navToggle');
      var menu = document.getElementById('navMenu');
      if (!toggle || !menu) return;
      toggle.addEventListener('click', function() {
        var isOpen = menu.classList.contains('open');
        menu.classList.toggle('open', !isOpen);
        toggle.classList.toggle('active', !isOpen);
        toggle.setAttribute('aria-expanded', String(!isOpen));
        document.body.classList.toggle('nav-open', !isOpen);
      });
      menu.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
          menu.classList.remove('open');
          toggle.classList.remove('active');
          toggle.setAttribute('aria-expanded', 'false');
          document.body.classList.remove('nav-open');
        });
      });
    })();
  </script>
</header>
